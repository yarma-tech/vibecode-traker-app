[package]
name = "bureau"
version = "0.1.0"
edition = "2021"
description = "Application de bureau de Vibe Map : sert l'interface depuis la machine et l'affiche dans sa fenetre"
license = "MIT"

[lib]
name = "bureau"
path = "src/lib.rs"

[[bin]]
name = "bureau"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# Le lecteur, embarque comme bibliotheque et jamais recopie (PRD-002) :
# l'application et le binaire en ligne de commande font tourner le meme code.
vibemap = { path = "../daemon" }
# Le lecteur est asynchrone ; l'application lui donne sa propre machinerie
# d'execution, sur un fil a part de celui de la fenetre.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
