name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ hashFiles('daemon/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Les tests d'integration parlent a une vraie pile Supabase locale : ils
      # ne tournent pas ici, faute de base. Ils restent la verification qui
      # compte, et se lancent a la main avant chaque fusion (voir le README).
      # Ce qui tourne ici est tout ce qui n'a besoin de personne.
      - name: Tests hors reseau
        run: cargo test --test journal --test config --test plan --test worktree --test reprise --test robustesse --test version --test verrou --test lecteur --test depouillement

  bureau:
    name: Bureau (Tauri)
    # L'application de bureau ne vise que macOS. La compiler ailleurs
    # demanderait un moteur web qui n'y sert a rien, et ne dirait rien de plus.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bureau
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bureau/target
          key: cargo-bureau-${{ hashFiles('bureau/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # La sonde s'eprouve sur des ports que le systeme donne, sur la boucle
      # locale : ces tests ne parlent a personne. La fenetre elle-meme, elle,
      # ne se verifie qu'a la main (voir bureau/VERIFICATIONS.md).
      - name: Tests hors reseau
        run: cargo test --test sonde --test url --test geometrie --test lecteur --test pont --test ajout --test publication --test machine

  web:
    name: Web (Next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer
        run: npm ci

      - name: Lint
        run: npx eslint .

      # Les tests unitaires de la logique pure (bascule figé, âge du battement)
      # tournent ici : ils ne parlent a personne, juste des fonctions.
      - name: Tests unitaires
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Le build ne parle a personne : ces valeurs n'ont qu'a exister.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: cle-de-build
