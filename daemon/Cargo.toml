[package]
name = "vibemap"
version = "0.1.0"
edition = "2021"
description = "Daemon local de Vibe Map : observe les agents et pousse des metadonnees vers Supabase"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
toml = "0.8"
keyring = { version = "3", features = ["apple-native", "linux-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
uuid = { version = "1", features = ["v4"] }
