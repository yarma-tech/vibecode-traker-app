name: Release

# La distribution est la contrepartie du choix de Rust (ADR 0001, « Comment on
# limite ces risques », point 6) : « un binaire qu'on ne sait pas produire
# n'existe pas ». Un tag `v*` compile l'application de bureau et le binaire en
# ligne de commande, calcule leurs sommes de controle, et publie le tout en
# release GitHub.
#
# Une seule cible : macOS Apple Silicon (FR-079). L'application vise les Mac
# Apple Silicon et eux seuls - aucune version Intel n'est produite - et le
# binaire en ligne de commande l'accompagne sur ce meme poste, dont il est le
# compagnon et non plus une porte d'entree autonome (FR-082).
#
# CE QUI A ETE RETIRE, ET COMMENT LE REMETTRE
# -------------------------------------------
# La cible Linux x86_64 sortait ici jusqu'a la tranche #86. Elle a ete retiree
# par FR-079 : le chemin d'appairage par code disparait (FR-082), donc un poste
# Linux neuf n'a plus aucune porte d'entree, et publier un binaire dont
# l'entree est fermee reviendrait a publier une impasse. Les postes Linux deja
# relies gardent leur jeton et continuent d'etre acceptes.
#
# C'est un retrait de PORTEE, pris par le PRD-002 et pas par le PM : sa
# ratification est encore attendue (PRD-002, note en tete de « Hors scope
# global »). S'il le refuse, le retrait se defait en rejouant a l'envers le
# commit de #86 : la matrice ci-dessous retrouve son entree Ubuntu, la formule
# Homebrew son volet, le README son paragraphe, et `bureau/tests/publication.rs`
# ses deux assertions. Rien d'autre n'en depend.
on:
  push:
    tags:
      - "v*"

# Il faut le droit d'ecrire une release depuis le workflow.
permissions:
  contents: write

jobs:
  # L'etiquette est ce que l'utilisateur telechargera ; la version compilee est
  # ce que l'application et le binaire annonceront. Les laisser diverger,
  # c'est publier un paquet qui ment sur son propre numero - et l'ecran
  # Reglages (FR-068) le repeterait. On refuse la publication au lieu de la
  # rattraper : reetiqueter coute moins cher que de retirer une release fausse.
  etiquette:
    name: Verifier que l'etiquette est la version compilee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comparer l'etiquette aux manifestes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          attendue="${TAG#v}"
          echec=0
          verifier() {
            if [ "$2" != "$attendue" ]; then
              echo "::error::$1 annonce $2, l'etiquette annonce $attendue"
              echec=1
            fi
          }
          verifier "bureau/Cargo.toml" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' bureau/Cargo.toml | head -1)"
          verifier "daemon/Cargo.toml" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml | head -1)"
          verifier "web/package.json" \
            "$(node -p "require('./web/package.json').version")"
          exit "$echec"

  # L'application de bureau : le paquet `.app` que l'utilisateur glisse dans ses
  # Applications (FR-067). Il embarque le lecteur, compile dans le meme binaire.
  application:
    name: Construire l'application macOS
    needs: etiquette
    runs-on: macos-14
    defaults:
      run:
        working-directory: bureau
    steps:
      - uses: actions/checkout@v5

      - name: Ajouter la cible
        run: rustup target add aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bureau/target
          key: cargo-release-bureau-${{ hashFiles('bureau/Cargo.lock') }}

      # La CLI Tauri en binaire deja compile, plutot que `cargo install
      # tauri-cli` qui recompilerait tout l'outil a chaque release.
      #
      # L'application n'est ni signee ni notariee : c'est un hors-scope assume
      # du PRD-002, faute de compte developpeur Apple. Au premier lancement,
      # macOS annonce un « developpeur non identifie » ; le README dit comment
      # passer outre.
      - name: Empaqueter l'application
        run: npx --yes @tauri-apps/cli@^2 build --target aarch64-apple-darwin --bundles app

      # Une archive et sa somme de controle sha256 a cote, comme pour le binaire.
      # `ditto` plutot que `zip` : c'est l'outil d'Apple, il preserve les liens
      # symboliques et les ressources d'un `.app`, qu'un zip ordinaire abime.
      - name: Archiver l'application
        id: paquet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          nom="VibeMap-${version}-aarch64-apple-darwin"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "target/aarch64-apple-darwin/release/bundle/macos/Vibe Map.app" \
            "dist/${nom}.app.zip"
          cd dist
          shasum -a 256 "${nom}.app.zip" > "${nom}.app.zip.sha256"
          echo "archive=bureau/dist/${nom}.app.zip" >> "$GITHUB_OUTPUT"
          echo "somme=bureau/dist/${nom}.app.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Verser les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: vibemap-application-macos
          path: |
            ${{ github.workspace }}/${{ steps.paquet.outputs.archive }}
            ${{ github.workspace }}/${{ steps.paquet.outputs.somme }}

  # Le binaire en ligne de commande, compagnon de l'application sur le meme Mac.
  build:
    name: Construire ${{ matrix.cible }}
    needs: etiquette
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: daemon
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 se compile nativement sur les runners Apple Silicon.
          # C'est desormais la seule entree de cette matrice : voir « ce qui a
          # ete retire » en tete de fichier.
          - runner: macos-14
            cible: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: Ajouter la cible
        env:
          CIBLE: ${{ matrix.cible }}
        run: rustup target add "$CIBLE"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-release-${{ matrix.cible }}-${{ hashFiles('daemon/Cargo.lock') }}

      - name: Compiler en release
        env:
          CIBLE: ${{ matrix.cible }}
        run: cargo build --release --target "$CIBLE"

      # Une archive par cible, nommee avec la version et la cible, plus un
      # fichier de somme de controle sha256 a cote. Le nom de l'archive est ce
      # que la formule Homebrew et le README referencent.
      - name: Empaqueter
        id: paquet
        env:
          CIBLE: ${{ matrix.cible }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          nom="vibemap-${version}-${CIBLE}"
          mkdir -p "dist/${nom}"
          cp "target/${CIBLE}/release/vibemap" "dist/${nom}/"
          cp ../README.md ../LICENSE "dist/${nom}/"
          tar -czf "dist/${nom}.tar.gz" -C dist "${nom}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${nom}.tar.gz" > "${nom}.tar.gz.sha256"
          else
            shasum -a 256 "${nom}.tar.gz" > "${nom}.tar.gz.sha256"
          fi
          echo "archive=daemon/dist/${nom}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "somme=daemon/dist/${nom}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Verser les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: vibemap-${{ matrix.cible }}
          path: |
            ${{ github.workspace }}/${{ steps.paquet.outputs.archive }}
            ${{ github.workspace }}/${{ steps.paquet.outputs.somme }}

  publier:
    name: Publier la release
    needs: [application, build]
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      # Une seule release : l'application, le binaire, et toutes leurs sommes de
      # controle attachees. Sur un tag, `gh release create` cree la release et
      # televerse.
      - name: Creer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DEPOT: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$DEPOT" \
            --title "vibemap $TAG" \
            --generate-notes \
            artefacts/*.app.zip artefacts/*.tar.gz artefacts/*.sha256
