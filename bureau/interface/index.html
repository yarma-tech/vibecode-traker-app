<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe Map</title>
    <!--
      La seule page que l'application sert elle-même. Elle occupe la fenêtre le
      temps que le service d'interface réponde, et reste dessus quand il ne
      répond pas : une fenêtre blanche ne dit rien à personne (FR-004).
      C'est aussi elle qui signale un lecteur qui ne tourne pas et propose de
      le relancer, avant de céder la place à la carte : la carte vient de la
      base, qui ne sait rien des faits de ce poste.
      Les phrases vivent ici plutôt que dans le programme : c'est du texte
      d'écran, et il se lit en français accentué comme le reste de l'interface.
    -->
    <style>
      :root {
        --paper: oklch(0.977 0.004 155);
        --paper-2: oklch(0.948 0.005 155);
        --ink: oklch(0.235 0.012 160);
        --ink-2: oklch(0.475 0.011 160);
        --ink-3: oklch(0.53 0.009 160);
        --rule: oklch(0.873 0.007 160);
        --edit: oklch(0.52 0.125 68);
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
        --ui: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: oklch(0.185 0.01 160);
          --paper-2: oklch(0.228 0.011 160);
          --ink: oklch(0.94 0.006 160);
          --ink-2: oklch(0.735 0.01 160);
          --ink-3: oklch(0.615 0.011 160);
          --rule: oklch(0.318 0.012 160);
          --edit: oklch(0.795 0.13 78);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--ui);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }

      main {
        max-width: 34rem;
      }

      .marque {
        font-family: var(--mono);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin: 0 0 1.25rem;
      }

      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.35;
        margin: 0 0 0.75rem;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 0.75rem;
        color: var(--ink-2);
        line-height: 1.6;
        font-size: 0.95rem;
      }

      .adresse {
        font-family: var(--mono);
        font-size: 0.85rem;
        color: var(--ink);
        background: var(--paper-2);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
        display: inline-block;
        user-select: text;
      }

      /* Les boutons sur une seule ligne : quand il y en a deux - relancer le
         lecteur, afficher la carte quand meme -, ils se lisent comme un choix
         et non comme une pile. */
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      button {
        display: block;
        margin-top: 1.25rem;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 7px;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.88;
      }

      /* Le second choix, quand il y en a deux : le meme gabarit, sans le poids
         du plein. Un liseré interne plutot qu'une bordure, pour que les deux
         boutons gardent exactement la meme hauteur. */
      button.secondaire {
        color: var(--ink);
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--rule);
      }

      /* Le `display: block` ci-dessus l'emporterait sur l'attribut `hidden` :
         sans cette regle, le bouton caché resterait visible. */
      button[hidden] {
        display: none;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      button:focus-visible {
        outline: 2px solid var(--edit);
        outline-offset: 2px;
      }

      .attente h1 {
        color: var(--ink-2);
        font-weight: 500;
      }

      .attente .adresse,
      .attente button {
        display: none;
      }
    </style>
  </head>
  <body class="attente">
    <main>
      <p class="marque">Vibe Map</p>
      <h1 id="titre">Démarrage de l'interface…</h1>
      <p id="explication">
        L'application sert la carte depuis votre machine. Cela prend quelques secondes au premier
        lancement.
      </p>
      <p id="ligne-adresse"><span class="adresse" id="adresse"></span></p>
      <div class="actions">
        <button id="reessayer" type="button">Réessayer</button>
        <button id="relancer" type="button" hidden>Relancer le lecteur</button>
        <button id="continuer" type="button" hidden>Afficher la carte</button>
      </div>
    </main>

    <script>
      // Sans ce pont, la page ne saurait jamais où en est l'ouverture et
      // resterait indéfiniment sur son écran d'attente - la fenêtre muette
      // que FR-004 interdit. Elle le dit plutôt que d'attendre.
      const pont = window.__TAURI__?.core;
      const horsApplication = async (commande) =>
        commande === "etat_du_lecteur"
          ? { etat: "arrete" }
          : {
              etat: "echouee",
              cas: "service",
              port: 51789,
              secondes: 0,
              detail:
                "Cette page ne peut être affichée que par l'application Vibe Map, " +
                "qui seule sait où en est le démarrage de l'interface.",
            };
      const invoke = pont ? pont.invoke : horsApplication;
      const titre = document.getElementById("titre");
      const explication = document.getElementById("explication");
      const adresse = document.getElementById("adresse");
      const bouton = document.getElementById("reessayer");
      const relancer = document.getElementById("relancer");
      const continuer = document.getElementById("continuer");
      const ligneAdresse = document.getElementById("ligne-adresse");

      // Chaque cas nomme le port : c'est le seul fait que l'utilisateur peut
      // aller vérifier lui-même (FR-070).
      function phrases(echec) {
        if (echec.cas === "port_pris") {
          return {
            titre: `Le port ${echec.port} est déjà pris`,
            explication:
              "Un autre programme écoute déjà à cette adresse. Vibe Map n'en utilise aucune " +
              "autre : son adresse de retour de connexion et sa session y sont attachées. " +
              "Fermez ce programme, puis réessayez.",
          };
        }
        if (echec.cas === "sans_reponse") {
          return {
            titre: `L'interface n'a pas répondu sur le port ${echec.port}`,
            explication:
              `Le service a été lancé, mais rien n'a répondu à cette adresse en ${echec.secondes} ` +
              "secondes. Réessayez ; s'il reste muet, relancez l'application.",
          };
        }
        return {
          titre: `L'interface n'a pas pu démarrer sur le port ${echec.port}`,
          explication: echec.detail,
        };
      }

      function afficherEchecDeLInterface(ouverture) {
        const dit = phrases(ouverture);
        titre.textContent = dit.titre;
        explication.textContent = dit.explication;
        adresse.textContent = `http://127.0.0.1:${ouverture.port}`;
        ligneAdresse.hidden = false;
        relancer.hidden = true;
        continuer.hidden = true;
        bouton.hidden = false;
        bouton.disabled = false;
        document.body.classList.remove("attente");
      }

      // Le lecteur est ce qui alimente la carte depuis cette machine. Qu'il
      // n'ait pas démarré ne se voit nulle part ailleurs : la carte vient de la
      // base, et la base ne sait rien d'un verrou pris sur ce poste. C'est donc
      // ici, avant de céder la place, que ça se dit.
      // Le poste tenu est le cas que l'utilisateur rencontre : la phrase
      // s'écrit ici, en français accentué et à l'heure de la machine, à partir
      // des faits que l'application rapporte. `raison` ne sert qu'au reste.
      function quiTientLePoste(tenant) {
        if (!tenant) {
          return (
            "Un lecteur tient déjà ce poste sans avoir laissé de marque lisible : " +
            "impossible de le nommer."
          );
        }
        const depuis = new Date(tenant.depuis);
        const quand = Number.isNaN(depuis.valueOf())
          ? ""
          : `, depuis ${depuis.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })}`;
        return `Le poste est tenu par ${tenant.vehicule} (processus ${tenant.pid})${quand}.`;
      }

      // Ce que la fenêtre dit du lecteur, état par état, et si un bouton de
      // relance sert à quelque chose. Une seule fonction décide : ailleurs, on
      // ne fait qu'écrire ce qu'elle a dit.
      const RIEN_NE_PART =
        "Cette machine n'enverra rien tant qu'il ne tourne pas : la carte s'affiche " +
        "quand même, mais elle ne dira plus ce qui se passe ici.";

      function phrasesDuLecteur(lecteur) {
        if (lecteur.etat === "en_demarrage") {
          return {
            titre: "Démarrage du lecteur…",
            explication:
              "Le lecteur lit le jeton de cette machine au trousseau. Si le système demande " +
              "une autorisation, accordez-la : sans elle, il ne démarrera pas.",
            relance: false,
          };
        }
        if (lecteur.etat === "en_marche") {
          return {
            titre: "Le lecteur tourne",
            explication: "Cette machine envoie de nouveau ce qui s'y passe.",
            relance: false,
          };
        }
        if (lecteur.etat === "arrete") {
          return {
            titre: "Le lecteur est arrêté",
            explication: RIEN_NE_PART,
            relance: true,
          };
        }
        if (lecteur.cas === "poste_tenu") {
          return {
            titre: "Un lecteur tourne déjà sur cette machine",
            explication:
              `${quiTientLePoste(lecteur.tenant)} Vibe Map n'en démarre pas un second : la ` +
              "même activité partirait en double. La carte s'affiche quand même, alimentée " +
              "par ce lecteur-là. Pour que ce soit celui de l'application, arrêtez l'autre " +
              "puis relancez.",
            relance: true,
          };
        }
        if (lecteur.cas === "arret_inattendu") {
          return {
            titre: "Le lecteur s'est arrêté tout seul",
            explication: `Il tournait, et il ne tourne plus. ${RIEN_NE_PART}`,
            relance: true,
          };
        }
        if (lecteur.cas === "jeton_refuse") {
          return {
            titre: "Le jeton de cette machine n'a pas pu être lu",
            explication:
              `${lecteur.raison} C'est ce qui arrive après une mise à jour de l'application : ` +
              "le système redemande l'autorisation, et un refus laisse le lecteur à l'arrêt.",
            relance: true,
          };
        }
        return {
          titre: "Le lecteur n'a pas démarré",
          explication: `${lecteur.raison} ${RIEN_NE_PART}`,
          relance: true,
        };
      }

      function afficherEtatDuLecteur(lecteur, port) {
        const dit = phrasesDuLecteur(lecteur);
        titre.textContent = dit.titre;
        explication.textContent = dit.explication;
        // Pas d'adresse ici : ce n'est pas le port qui est en cause, et un cadre
        // vide se verrait.
        ligneAdresse.hidden = true;
        // « Réessayer » ne vaut que pour l'interface : ici, ce qui se reprend,
        // c'est le lecteur.
        bouton.hidden = true;
        relancer.hidden = !dit.relance;
        relancer.disabled = false;
        continuer.hidden = false;
        continuer.disabled = false;
        // La carte passe au second plan tant qu'il y a quelque chose à réparer.
        continuer.classList.toggle("secondaire", dit.relance);
        continuer.onclick = () => allerALaCarte(port);
        document.body.classList.remove("attente");
      }

      function allerALaCarte(port) {
        // `replace` et non une affectation : la page d'attente ne doit pas
        // rester derrière la carte dans l'historique de la fenêtre.
        window.location.replace(`http://127.0.0.1:${port}`);
      }

      // Une décision prise ne se défait pas : sans cela, la relève suivante
      // emmènerait la fenêtre sur la carte pendant que l'utilisateur lit ce
      // qu'on a à lui dire.
      let decide = false;

      // Et ce que la page a dit du lecteur, elle ne le retire pas : une fois
      // qu'elle en a parlé, elle suit son état - jusqu'à dire qu'il est
      // reparti - mais n'emmène plus la fenêtre d'elle-même. Partir vers la
      // carte redevient un geste de l'utilisateur, ici comme ailleurs : la page
      // reste seule à décider de la navigation.
      let annonce = false;

      // On demande où en est l'application plutôt que d'attendre un signal :
      // l'ouverture peut avoir abouti, ou échoué, avant que cette page ne soit
      // affichée.
      async function suivre() {
        if (decide) {
          return;
        }
        try {
          const [ouverture, lecteur] = await Promise.all([
            invoke("etat_de_l_interface"),
            invoke("etat_du_lecteur"),
          ]);

          if (ouverture.etat === "echouee") {
            afficherEchecDeLInterface(ouverture);
            return;
          }
          if (ouverture.etat !== "faite") {
            return;
          }

          // Le lecteur ensuite : tant qu'il ne tourne pas, la fenêtre le dit
          // plutôt que de céder la place à une carte que cette machine
          // n'alimente plus.
          if (!annonce && lecteur.etat === "en_marche") {
            decide = true;
            allerALaCarte(ouverture.port);
            return;
          }

          afficherEtatDuLecteur(lecteur, ouverture.port);
          // Un démarrage en cours n'engage à rien : il aboutit, et la fenêtre
          // part alors d'elle-même vers la carte. Tout le reste s'annonce, et
          // ce qui est annoncé ne se retire pas.
          annonce = annonce || lecteur.etat !== "en_demarrage";
        } catch (erreur) {
          console.error(erreur);
        }
      }

      bouton.addEventListener("click", async () => {
        bouton.disabled = true;
        document.body.classList.add("attente");
        titre.textContent = "Démarrage de l'interface…";
        explication.textContent = "Nouvel essai en cours.";
        await invoke("reessayer");
      });

      // Relancer, sans quitter l'application. La commande rend la main tout de
      // suite - la lecture du jeton au trousseau peut attendre longtemps -, et
      // c'est le suivi, quelques centièmes plus tard, qui dit où en est le
      // nouveau départ.
      relancer.addEventListener("click", async () => {
        relancer.disabled = true;
        await invoke("relancer_le_lecteur");
      });

      setInterval(suivre, 400);
      suivre();
    </script>
  </body>
</html>
